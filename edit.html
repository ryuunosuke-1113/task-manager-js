<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>タスク編集</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="container">
      <h1>タスク編集</h1>

      <div id="edit-error" class="edit-error" hidden></div>

      <form id="edit-task-form">
        <div class="form-group">
          <label for="edit-title"> タスク名 </label>

          <input type="text" id="edit-title" name="title" required />
        </div>

        <div class="form-group">
          <label for="edit-description"> メモ </label>

          <textarea
            id="edit-description"
            name="description"
            rows="4"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="edit-due-date"> 期限 </label>

          <input type="date" id="edit-due-date" name="dueDate" required />
        </div>

        <div class="form-group">
          <label for="edit-length"> 長さ </label>

          <select id="edit-length" name="length">
            <option value="1">短い</option>
            <option value="2">普通</option>
            <option value="3">長時間</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="button button-primary">更新する</button>

          <a href="index.html" class="button button-back"> 一覧に戻る </a>
        </div>
      </form>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/edit.js"></script>
  </body>
</html>
